[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skilltend"
version = "0.1.0"
description = "Online skill maintenance for Jiuwen — Hermes-style background review and curator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — Huawei Technologies Co., Ltd." }
authors = [
    { name = "Huawei Technologies Co., Ltd." },
]
dependencies = [
    "PyYAML>=6.0",
    "litellm>=1.0",
    # openjiuwen is a sibling project; install it separately or via:
    # pip install -e ../agent-core
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["skilltend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
